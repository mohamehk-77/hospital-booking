databases:
  - name: rady-db
    databaseName: hospital_db
    user: rady
    plan: free

services:
  - type: web
    name: rady-hospital
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rady-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
